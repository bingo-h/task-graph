# task-web 发布工作流
#
# 触发条件：推送形如 v1.0.0 的 tag
#   git tag v1.0.0
#   git push origin v1.0.0
#
# 工作流程：
#   1. 构建前端（Node.js + npm）
#   2. 并行编译 Linux 和 Windows 二进制（Rust + rust-embed 嵌入前端）
#   3. 创建 GitHub Release，上传两个平台的可执行文件

name: Release

on:
  push:
    tags:
      - 'v*'   # 匹配 v1.0.0、v0.2.1 等

env:
  CARGO_TERM_COLOR: always

jobs:

  # ── 步骤一：构建前端 ─────────────────────────────────────────────────────────
  # 先单独构建前端，产物上传为 artifact，供后续编译步骤下载使用。
  # 只构建一次，Linux 和 Windows 编译共用同一份前端 dist。
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      # 将 dist/ 上传为 artifact，供后续 job 下载
      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 步骤二：编译各平台二进制 ─────────────────────────────────────────────────
  build-backend:
    name: 编译后端 (${{ matrix.target }})
    needs: build-frontend   # 等待前端构建完成
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: task-web
            asset_name: task-web-linux-x86_64

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: task-web.exe
            asset_name: task-web-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      # 下载前端 dist（rust-embed 编译时需要）
      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存 Rust 编译产物，加速后续构建
      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 编译后端
        working-directory: backend-rust
        run: cargo build --release --target ${{ matrix.target }}

      # 将二进制重命名为带平台标识的文件名，便于用户区分
      - name: 重命名产物（Linux）
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp backend-rust/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} \
             ${{ matrix.asset_name }}

      - name: 重命名产物（Windows）
        if: matrix.os == 'windows-latest'
        run: |
          cp backend-rust/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} `
             ${{ matrix.asset_name }}

      # 上传二进制供 release job 使用
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  # ── 步骤三：创建 GitHub Release ──────────────────────────────────────────────
  release:
    name: 创建 Release
    needs: build-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release 和上传文件

    steps:
      - uses: actions/checkout@v4

      # 下载所有平台的二进制
      - name: 下载 Linux 二进制
        uses: actions/download-artifact@v4
        with:
          name: task-web-linux-x86_64

      - name: 下载 Windows 二进制
        uses: actions/download-artifact@v4
        with:
          name: task-web-windows-x86_64.exe

      # 从 tag 名提取版本号（去掉 "v" 前缀）
      - name: 提取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # 创建 Release 并上传文件
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "task-web v${{ steps.version.outputs.VERSION }}"
          # Release 说明模板
          body: |
            ## 安装

            ### Linux
            ```bash
            # 下载
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/task-web-linux-x86_64 -o task-web
            chmod +x task-web
            # 运行
            ./task-web
            # 访问 http://localhost:8765
            ```

            ### Windows
            下载 `task-web-windows-x86_64.exe`，双击运行，浏览器打开 http://localhost:8765

            ## 说明
            - 单文件，无需安装任何依赖
            - 需要系统已安装 [Taskwarrior](https://taskwarrior.org)
          files: |
            task-web-linux-x86_64
            task-web-windows-x86_64.exe
          draft: false
          prerelease: false
