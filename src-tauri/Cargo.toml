[package]
name = "task-graph"
version = "1.2.3"
description = "桌面任务管理工具"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "task_graph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# custom-protocol 必须默认开启：它决定 tauri 运行时是走生产模式（从二进制加载打包好的
# 前端资源）还是 dev 模式（连接 devUrl，如 http://localhost:9999）。
# `cargo tauri build` 会自动传入这个 feature，但像 Nix 的 buildRustPackage 这类直接
# 调用 `cargo build` 的打包方式不经过 tauri-cli，若不放进 default 就永远走不到生产模式，
# 运行时会报 "Could not connect to localhost" 这类连接被拒绝的错误。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.20.0", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dirs = "6.0.0"
unicode-segmentation = "1.12.0"
fontdb = "0.21"
