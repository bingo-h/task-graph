# task-graph 发布工作流
#
# 触发条件：推送形如 v1.0.0 的 tag
#   git tag v1.0.0
#   git push origin v1.0.0
#
# 工作流程：
#   1. 在 Windows / Linux runner 上分别原生构建 Tauri 应用
#      （Tauri 打包依赖系统 WebView/NSIS 等组件，无法从 Linux 交叉编译到 Windows，
#       因此两个平台各自在对应的 GitHub 托管 runner 上构建）
#   2. 创建 GitHub Release，上传各平台的安装包

name: Release

on:
  push:
    tags:
      - 'v*'   # 匹配 v1.0.0、v0.2.1 等

env:
  CARGO_TERM_COLOR: always

jobs:

  build:
    name: 构建 (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖（Tauri 打包所需）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 缓存 Cargo 依赖与 tauri-cli 二进制，加速后续构建
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      # ~/.cargo/bin 被缓存了，命中缓存时 tauri-cli 已存在，需跳过避免 cargo install 报错
      - name: 安装 tauri-cli
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # 用 tag 名（去掉 v 前缀）覆盖 tauri.conf.json 的 version 字段，
      # 确保打包产物文件名的版本号与 Release tag 一致，仅在本次 CI checkout 中生效
      - name: 同步版本号到 tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(p, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + '\n');
          "

      # cargo tauri build 会根据 tauri.conf.json 的 beforeBuildCommand
      # 自动执行 `npm run build --prefix frontend`，无需单独构建前端。
      # createUpdaterArtifacts（tauri.conf.json 里配置）+ 下面两个签名环境变量，
      # 会让 Tauri 额外生成 .sig 签名文件，供应用内自动更新校验用
      - name: 构建 Tauri 应用
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      # 便携版：不走安装程序，直接把裸 exe 打 zip，解压即用、删文件夹即卸载，
      # 数据库文件按 db/mod.rs 的逻辑保存在 exe 同目录，天然满足便携语义
      - name: 打包 Windows 便携版
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p portable
          cp src-tauri/target/release/task-graph.exe "portable/task-graph.exe"
          cd portable
          7z a "../src-tauri/target/release/bundle/task-graph_${VERSION}_x64-portable.zip" task-graph.exe

      - name: 上传 Windows 安装包
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: task-graph-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/*.zip
          retention-days: 1

      - name: 上传 Linux 安装包
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: task-graph-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 1

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release 和上传文件

    steps:
      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: task-graph-windows
          path: dist/windows

      - name: 下载 Linux 安装包
        uses: actions/download-artifact@v4
        with:
          name: task-graph-linux
          path: dist/linux

      - name: 提取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # 应用内自动更新（tauri-plugin-updater）依赖这份 latest.json：
      # 它固定从 releases/latest/download/latest.json 读取，描述各平台安装包的
      # 下载地址和签名（签名内容就是 CI 构建时生成的 .sig 文件原文）
      # actions/upload-artifact 会保留相对公共父目录（bundle/）的子路径，
      # 所以下载下来的文件实际带着 nsis/、msi/、appimage/、deb/ 这层子目录，
      # 这里用递归查找而不是写死平铺路径，避免目录结构一变就 ENOENT
      - name: 生成 latest.json
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const version = '${{ steps.version.outputs.VERSION }}';
            const repo = '${{ github.repository }}';
            const base = \`https://github.com/\${repo}/releases/download/v\${version}\`;

            function findFile(dir, name) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const found = findFile(full, name);
                  if (found) return found;
                } else if (entry.name === name) {
                  return full;
                }
              }
              return null;
            }
            const readSig = (dir, name) => {
              const p = findFile(dir, name);
              if (!p) throw new Error(\`找不到文件: \${name}（搜索目录: \${dir}）\`);
              return fs.readFileSync(p, 'utf8').trim();
            };

            const manifest = {
              version,
              notes: 'task-web v' + version,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: readSig('dist/windows', \`task-web_\${version}_x64-setup.exe.sig\`),
                  url: \`\${base}/task-web_\${version}_x64-setup.exe\`,
                },
                'linux-x86_64': {
                  signature: readSig('dist/linux', \`task-web_\${version}_amd64.AppImage.sig\`),
                  url: \`\${base}/task-web_\${version}_amd64.AppImage\`,
                },
              },
            };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          "

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "task-web v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 安装

            ### Windows
            - 便携版（推荐）：下载 `x64-portable.zip`，解压后双击 `task-web.exe` 直接运行，无需安装，数据库文件保存在解压出的文件夹里，删文件夹即卸载
            - 安装版：下载并运行 `.exe`（NSIS 安装程序）或 `.msi`，按提示安装

            ### Linux
            - `.AppImage`：赋予可执行权限后直接运行，无需安装
              ```bash
              chmod +x task-web_*.AppImage
              ./task-web_*.AppImage
              ```
            - `.deb`：`sudo dpkg -i task-web_*.deb`

            ## 说明
            数据库文件保存在程序自身所在目录，卸载/迁移只需删除对应文件夹即可（不写系统标准数据目录）。

            应用内「设置 → 关于 → 检查更新」支持自动检查并安装新版本。
          files: |
            dist/windows/**
            dist/linux/**
            latest.json
          draft: false
          prerelease: false
