# task-web 发布工作流
#
# 触发条件：推送形如 v1.0.0 的 tag
#   git tag v1.0.0
#   git push origin v1.0.0
#
# 工作流程：
#   1. 在 Windows / Linux runner 上分别原生构建 Tauri 应用
#      （Tauri 打包依赖系统 WebView/NSIS 等组件，无法从 Linux 交叉编译到 Windows，
#       因此两个平台各自在对应的 GitHub 托管 runner 上构建）
#   2. 创建 GitHub Release，上传各平台的安装包

name: Release

on:
  push:
    tags:
      - 'v*'   # 匹配 v1.0.0、v0.2.1 等

env:
  CARGO_TERM_COLOR: always

jobs:

  build:
    name: 构建 (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖（Tauri 打包所需）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 缓存 Cargo 依赖与 tauri-cli 二进制，加速后续构建
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # 用 tag 名（去掉 v 前缀）覆盖 tauri.conf.json 的 version 字段，
      # 确保打包产物文件名的版本号与 Release tag 一致，仅在本次 CI checkout 中生效
      - name: 同步版本号到 tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(p, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + '\n');
          "

      # cargo tauri build 会根据 tauri.conf.json 的 beforeBuildCommand
      # 自动执行 `npm run build --prefix frontend`，无需单独构建前端
      - name: 构建 Tauri 应用
        working-directory: src-tauri
        run: cargo tauri build

      - name: 上传 Windows 安装包
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: task-web-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 1

      - name: 上传 Linux 安装包
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: task-web-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 1

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release 和上传文件

    steps:
      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: task-web-windows
          path: dist/windows

      - name: 下载 Linux 安装包
        uses: actions/download-artifact@v4
        with:
          name: task-web-linux
          path: dist/linux

      - name: 提取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "task-web v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 安装

            ### Windows
            下载并运行 `.exe`（NSIS 安装程序）或 `.msi`，按提示安装即可。

            ### Linux
            - `.AppImage`：赋予可执行权限后直接运行，无需安装
              ```bash
              chmod +x task-web_*.AppImage
              ./task-web_*.AppImage
              ```
            - `.deb`：`sudo dpkg -i task-web_*.deb`

            ## 说明
            数据库文件保存在程序自身所在目录，卸载/迁移只需删除对应文件夹即可（不写系统标准数据目录）。
          files: |
            dist/windows/**
            dist/linux/**
          draft: false
          prerelease: false
